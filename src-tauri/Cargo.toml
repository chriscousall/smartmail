[package]
name = "smartmail"
version = "0.1.0"
description = "A lightweight desktop email client"
authors = []
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "smartmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
imap = "2.4.1"
native-tls = "0.2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mailparse = "0.17.0"
chrono = "0.4"
serde_json = "1.0"
dom_query = "0.28.0"
